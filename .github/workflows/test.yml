name: Flask App CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # PostgreSQL 16 サービスコンテナをバックグラウンドで起動
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bookgram_db
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Initialize Database Table
      env:
        DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/bookgram_db
      run: |
        python init_db.py

    - name: Run Pytest
      env:
        DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/bookgram_db
        SECRET_KEY: ci-test-secret-key
      run: |
        pytest test_app.py -v